<form [formGroup]="form">
  <input
    type="text"
    class="form-control"
    formControlName="search"
    placeholder="Chercher un CV..."
    title="Rechercher un CV par nom"
    aria-label="Recherche de CV"
  />
</form>

<div class="list-group mt-2">
  <button
    type="button"
    class="list-group-item list-group-item-action"
    *ngFor="let cv of suggestions$ | async"
    (click)="select(cv)"
  >
    {{ cv.firstname }} {{ cv.name }} - {{ cv.job }}
  </button>
</div>

<div class="mt-3" *ngIf="selected; else noSelected">
  <h5>Selected CV</h5>
  <p><strong>Name:</strong> {{ selected.firstname }} {{ selected.name }}</p>
  <p><strong>Job:</strong> {{ selected.job }}</p>
  <p><strong>Age:</strong> {{ selected.age }}</p>
</div>
<ng-template #noSelected>
  <p>No CV selected.</p>
</ng-template>
